name: Benchmark
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    name: Reference solutions pass verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned native engine
        run: npm ci --no-audit --no-fund
      - name: Run every task verifier against its example solution
        run: npm run benchmark
      - name: Run the benchmark test suite
        run: npm test
